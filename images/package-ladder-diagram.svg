  <text x="80" y="138" fill="#a8b2c8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Preview to Local to Authority to Max - unlock when scope grows</text>
  <path d="M210 470 H1390" stroke="rgba(100,255,218,0.28)" stroke-width="4" stroke-dasharray="10 12" fill="none"/>
