  <text x="950" y="500" text-anchor="middle" fill="#a8b2c8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Service + city depth</text>
  <text x="950" y="535" text-anchor="middle" fill="#a8b2c8" font-family="Segoe UI, Arial, sans-serif" font-size="20">schema + crawl health</text>
  <text x="950" y="610" text-anchor="middle" fill="#9ef0d0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Unlock: Max</text>
